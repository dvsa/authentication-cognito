name: Security analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'
  # See the note in tests.yml.
  workflow_dispatch:

# security-events: write is required by github/codeql-action/upload-sarif at the end of
# this workflow. A read-only permissions block — which is what the generic CodeQL
# 'workflow does not contain permissions' autofix suggests — would fail every matrix cell
# at the upload step.
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]

    name: Snyk - PHP ${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        if: ${{ success() || failure() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          # Each matrix cell resolves a different dependency tree, so each needs its own
          # category — uploads sharing one would overwrite each other's results.
          category: snyk-php${{ matrix.php }}-${{ matrix.stability }}

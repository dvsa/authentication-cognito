name: Static analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'
  # See the note in tests.yml — lets a run be started by hand after the schedule has been
  # auto-disabled for inactivity.
  workflow_dispatch:

# These were previously pinned to PHP 8.0, so an analyser could break on a supported version
# without anything noticing — which is exactly what happened: Psalm 4.30 cannot run on 8.4 at
# all. Running each analyser across the full supported range is what catches that.
jobs:
  phpstan:
    name: PHPStan - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, intl

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Install PHPStan
        run: composer bin phpstan update --no-interaction --no-progress

      - name: Execute PHPStan
        run: vendor/bin/phpstan analyze --no-progress

  php-codesniffer:
    name: PHP-CodeSniffer - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Install PHP CodeSniffer
        run: composer bin php-codesniffer update --no-interaction --no-progress

      - name: Execute PHP CodeSniffer
        run: vendor/bin/phpcs -q

  psalm:
    name: Psalm - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, intl

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install Psalm
        run: composer bin psalm update --no-interaction --no-progress

      - name: Execute Psalm
        run: vendor/bin/psalm --no-progress --output-format=github
